<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d1138"/>
      <stop offset="100%" stop-color="#0b0716"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="28" y1="22" x2="100" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c49bff"/>
      <stop offset="100%" stop-color="#9146FF"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="24" y1="44" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9146FF"/>
      <stop offset="100%" stop-color="#5c16c5"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="64" y1="44" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#772ce8"/>
      <stop offset="100%" stop-color="#3b0d82"/>
    </linearGradient>
    <linearGradient id="mintGlow" x1="48" y1="30" x2="80" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cffbe"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#9146FF" stroke-width="3" stroke-opacity="0.65"/>
  <!-- Outer Pulse Rings -->
  <circle cx="64" cy="64" r="48" stroke="#00f59b" stroke-width="1.5" stroke-opacity="0.28" stroke-dasharray="6 6"/>
  <!-- Isometric Loot Cube -->
  <polygon points="64,20 104,42 64,64 24,42" fill="url(#cubeTop)" stroke="#e2ccff" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="24,42 64,64 64,108 24,86" fill="url(#cubeLeft)" stroke="#b17aff" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="104,42 64,64 64,108 104,86" fill="url(#cubeRight)" stroke="#9146FF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cybernetic Neon Ribbon / Seams -->
  <path d="M44 31 L84 53 L84 97" stroke="#00f59b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M84 31 L44 53 L44 97" stroke="#00f59b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Central Emerald Lightning Bolt Badge -->
  <circle cx="64" cy="66" r="19" fill="#0e091c" stroke="#00f59b" stroke-width="2.5"/>
  <path d="M67 49 L53 67 H64 L61 83 L75 65 H64 L67 49 Z" fill="url(#mintGlow)"/>
</svg>
