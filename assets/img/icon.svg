<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf85ff" />
      <stop offset="100%" stop-color="#9146FF" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00c77b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9146FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Glowing Outer Shield/Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#18181b" stroke="url(#purpleGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Controller Top Silhouette -->
  <path d="M40 38 C 30 38, 22 46, 22 58 C 22 72, 32 88, 44 88 C 48 88, 52 84, 56 76 C 58 72, 60 70, 64 70 C 68 70, 70 72, 72 76 C 76 84, 80 88, 84 88 C 96 88, 106 72, 106 58 C 106 46, 98 38, 88 38 Z" fill="url(#purpleGrad)"/>

  <!-- D-Pad Left -->
  <path d="M38 52 H44 V58 H38 Z M38 46 H44 V52 H38 Z M32 52 H38 V58 H32 Z M44 52 H50 V58 H44 Z M38 58 H44 V64 H38 Z" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Action Buttons Right -->
  <circle cx="84" cy="50" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="92" cy="58" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="76" cy="58" r="3.5" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="84" cy="66" r="3.5" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Emerald Gift Drop Box Center-Bottom -->
  <g transform="translate(42, 66)">
    <!-- Box Body -->
    <rect x="4" y="16" width="36" height="28" rx="4" fill="url(#emeraldGrad)"/>
    <!-- Box Lid -->
    <rect x="1" y="10" width="42" height="8" rx="2" fill="#00ffaa"/>
    <!-- Vertical Ribbon -->
    <rect x="19" y="10" width="6" height="34" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Horizontal Ribbon -->
    <rect x="4" y="27" width="36" height="5" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Bow Loops -->
    <path d="M16 10 C 12 2, 22 2, 22 10 Z" fill="#00ffaa" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M28 10 C 32 2, 22 2, 22 10 Z" fill="#00ffaa" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="22" cy="10" r="2.5" fill="#ffffff"/>
  </g>
</svg>
