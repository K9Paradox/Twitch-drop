<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be87ff" />
      <stop offset="100%" stop-color="#9146FF" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffb0" />
      <stop offset="100%" stop-color="#00d684" />
    </linearGradient>
  </defs>

  <!-- Big Bold Twitch Gamepad (Fills Top 70% of canvas) -->
  <path d="M26 12 C 10 12, 2 24, 2 46 C 2 72, 16 100, 36 100 C 44 100, 52 92, 58 78 C 60 74, 62 72, 64 72 C 66 72, 68 74, 70 78 C 76 92, 84 100, 92 100 C 112 100, 126 72, 126 46 C 126 24, 118 12, 102 12 Z" fill="url(#purpleGrad)"/>

  <!-- Left D-Pad (Bold White) -->
  <rect x="22" y="38" width="20" height="7" rx="3" fill="#ffffff"/>
  <rect x="28.5" y="31.5" width="7" height="20" rx="3" fill="#ffffff"/>

  <!-- Right Action Buttons (Bold White) -->
  <circle cx="94" cy="34" r="5" fill="#ffffff"/>
  <circle cx="106" cy="45" r="5" fill="#ffffff"/>
  <circle cx="82" cy="45" r="5" fill="#ffffff"/>
  <circle cx="94" cy="56" r="5" fill="#ffffff"/>

  <!-- Glowing Emerald Drop Box Center-Bottom (Fills Bottom Half) -->
  <g transform="translate(32, 54)">
    <!-- Box Body with crisp dark stroke -->
    <rect x="4" y="24" width="56" height="46" rx="8" fill="url(#emeraldGrad)" stroke="#121214" stroke-width="4"/>
    <!-- Box Lid -->
    <rect x="0" y="14" width="64" height="14" rx="4" fill="#00ffcc" stroke="#121214" stroke-width="4"/>
    <!-- Vertical Ribbon -->
    <rect x="26" y="14" width="12" height="56" fill="#ffffff"/>
    <!-- Horizontal Ribbon -->
    <rect x="4" y="42" width="56" height="10" fill="#ffffff"/>
    <!-- Big Ribbon Bow -->
    <path d="M18 14 C 8 2, 28 2, 30 14 Z" fill="#ffffff" stroke="#121214" stroke-width="3"/>
    <path d="M46 14 C 56 2, 36 2, 34 14 Z" fill="#ffffff" stroke="#121214" stroke-width="3"/>
    <circle cx="32" cy="14" r="4.5" fill="#ffffff"/>
  </g>
</svg>
