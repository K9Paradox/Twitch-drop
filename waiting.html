<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for stream with drops...</title>
    <link rel="icon" href="assets/img/atd-32.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0e0e10;
            color: #efeff1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 14px rgba(145, 70, 255, 0.65));
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .gameName {
            color: #a970ff;
            font-weight: 800;
        }

        p {
            color: #adadb8;
            font-size: 14px;
            max-width: 420px;
            line-height: 1.5;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #26262c;
            border-top-color: #9146FF;
            border-radius: 50%;
            margin: 26px auto 8px;
            animation: spin 1s linear infinite;
        }

        .note {
            margin-top: 26px;
            font-size: 12px;
            color: #6d6d76;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <img class="logo" src="assets/img/atd-128.png" alt="Auto Twitch Drops">
    <h1 id="headline">Waiting for a live stream…</h1>
    <p id="subLine">No stream with enabled drops is live right now. This tab will automatically switch to a stream as soon as one is available.</p>
    <div class="spinner"></div>
    <p class="note">Do not close this tab — Auto Twitch Drops is managing it for you.</p>
    <script src="waiting.js"></script>
</body>

</html>
